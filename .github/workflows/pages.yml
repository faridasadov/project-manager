name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Smoke check (site returns 200)
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $url"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$url")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "Site is live."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Deployed site did not return 200 after retries"
          exit 1
